<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1621 662" role="img" aria-label="Mapa estilizado da Praia da Barrinha com pontos de referência">
  <!-- Coordenadas no mesmo sistema da foto de satélite (1621x662) para os pontos baterem com a imagem original. -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
      .mono{font-family:'IBM Plex Mono',monospace}
      .sans{font-family:'Bricolage Grotesque',system-ui,sans-serif}
      .espuma{fill:none;stroke:#5FD1C2;stroke-linecap:round}
      .cota{fill:none;stroke:#2A4A62;stroke-width:1.5;stroke-dasharray:4 8}
      .rotulo{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:17px;font-weight:600;fill:#EAF2F1}
      .num{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:19px;font-weight:800;fill:#0B1B2B}
    </style>
    <linearGradient id="mar" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#0C2131"/><stop offset="0.55" stop-color="#0A1A29"/><stop offset="1" stop-color="#081521"/>
    </linearGradient>
    <pattern id="pedras" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#3B5A70"/><circle cx="4" cy="4" r="2.6" fill="#506F84"/><circle cx="11" cy="10" r="2.2" fill="#2E4A5E"/>
    </pattern>
    <clipPath id="card"><rect width="1621" height="662" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1621" height="662" fill="url(#mar)"/>

    <!-- linhas de profundidade (ilustrativas) -->
    <path class="cota" d="M560,0 C600,120 700,230 840,250"/>
    <path class="cota" d="M820,0 C900,120 1000,230 1180,330 C1300,400 1420,450 1621,470"/>
    <path class="cota" d="M1120,0 C1200,110 1320,200 1621,260"/>

    <!-- terra -->
    <path fill="#1C374C" d="M0,0 H262 L275,130 L310,230 L350,300 L380,370 L420,430 L460,490 L500,560 L520,662 H0 Z"/>
    <path fill="none" stroke="#2A4A62" stroke-width="18" stroke-linecap="round" d="M20,40 L235,662"/>
    <g fill="#24435A"><rect x="80" y="20" width="70" height="60" rx="6"/><rect x="120" y="120" width="90" height="70" rx="6"/><rect x="175" y="230" width="70" height="80" rx="6"/><rect x="200" y="380" width="90" height="60" rx="6"/><rect x="250" y="470" width="110" height="70" rx="6"/><rect x="300" y="575" width="90" height="70" rx="6"/><rect x="0" y="380" width="70" height="90" rx="6"/><rect x="10" y="520" width="80" height="70" rx="6"/></g>
    <!-- areia -->
    <path fill="#C9B48A" fill-opacity="0.9" d="M262,0 H290 L305,130 L340,220 L400,300 L470,350 L520,400 L580,450 L640,490 L720,530 L768,548 L738,662 H520 L500,560 L460,490 L420,430 L380,370 L350,300 L310,230 L275,130 Z"/>
    <path fill="none" stroke="#EAF2F1" stroke-opacity="0.35" stroke-width="2" d="M290,0 L305,130 L340,220 L400,300 L470,350 L520,400 L580,450 L640,490 L720,530 L768,548"/>

    <!-- pedras do costão (sul) -->
    <path fill="#1C374C" d="M890,662 L935,612 L1000,598 L1060,618 L1105,598 L1150,560 L1230,556 L1300,615 L1335,662 Z"/>
    <path fill="url(#pedras)" opacity="0.8" d="M1110,600 L1150,566 L1225,562 L1290,615 L1310,662 L1140,662 Z"/>

    <!-- espuma / arrebentação -->
    <g class="espuma">
      <path stroke-width="16" stroke-opacity="0.18" d="M335,45 C385,115 455,165 505,265"/>
      <path stroke-width="2.5" stroke-opacity="0.8" stroke-dasharray="14 9" d="M345,45 C395,115 465,165 515,265"/>
      <path stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="8 10" d="M318,70 C350,140 400,200 450,290"/>
      <path stroke-width="16" stroke-opacity="0.18" d="M495,305 C555,335 605,385 620,470"/>
      <path stroke-width="2.5" stroke-opacity="0.8" stroke-dasharray="14 9" d="M505,300 C565,330 615,380 632,468"/>
      <path stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="8 10" d="M480,330 C525,370 560,410 585,460"/>
      <path stroke-width="16" stroke-opacity="0.18" d="M975,545 C1040,505 1110,515 1160,560"/>
      <path stroke-width="16" stroke-opacity="0.18" d="M1115,490 C1200,480 1285,545 1345,640"/>
      <path stroke-width="2.5" stroke-opacity="0.8" stroke-dasharray="14 9" d="M1120,478 C1210,470 1295,535 1360,635"/>
      <path stroke-width="2.5" stroke-opacity="0.6" stroke-dasharray="14 9" d="M915,640 C950,610 985,600 1010,610"/>
    </g>

    <!-- molhe -->
    <path fill="url(#pedras)" d="M735,662 L765,560 L878,292 C888,272 925,268 942,298 L832,560 L805,662 Z"/>
    <path fill="none" stroke="#8FA6B2" stroke-width="2" d="M735,662 L765,560 L878,292 C888,272 925,268 942,298 L832,560 L805,662"/>
    <path fill="none" stroke="#8FA6B2" stroke-opacity="0.5" stroke-width="10" stroke-dasharray="1 0" d="M782,640 L800,560 L908,295"/>
    <text class="mono" font-size="12" fill="#8FA6B2" letter-spacing="2" transform="translate(842,470) rotate(-67)">MOLHE</text>

    <!-- ondulações (exemplo fixo; a página da previsão troca por setas da hora) -->
    <g id="swell-fixo">
    <g stroke="#FF8A3D" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M1250,175 L1080,235"/><path d="M1092,218 L1080,235 L1100,240"/>
      <path d="M1460,610 L1420,470"/><path d="M1405,487 L1420,470 L1432,490"/>
    </g>
    <text class="mono" font-size="13" fill="#FF8A3D" x="1185" y="160">SWELL LESTE · ENTRA DIRETO</text>
    <text class="mono" font-size="13" fill="#FF8A3D" x="1448" y="540">SWELL SUL<tspan x="1448" dy="18">MOLHE BLOQUEIA</tspan></text>
    </g>

    <!-- textos de lugar -->
    <text class="mono" font-size="12" fill="#8FA6B2" letter-spacing="2" transform="translate(105,330) rotate(71)">AV. ITAJUBA</text>
    <text class="mono" font-size="12" fill="#0B1B2B" fill-opacity="0.7" letter-spacing="2" transform="translate(470,560) rotate(56)">PRAIA</text>
    <text class="mono" font-size="12" fill="#8FA6B2" letter-spacing="2" x="1150" y="625">COSTÃO</text>

    <!-- rosa dos ventos -->
    <g transform="translate(1560,62)">
      <circle r="26" fill="#12283B" stroke="#2A4A62" stroke-width="2"/>
      <path d="M0,-17 L7,6 L0,1 L-7,6 Z" fill="#EAF2F1"/>
      <text class="mono" font-size="11" fill="#8FA6B2" text-anchor="middle" y="44">N</text>
    </g>

    <!-- título -->
    <g id="mapa-titulo" transform="translate(36,44)">
      <rect x="-14" y="-28" width="300" height="78" rx="18" fill="#0B1B2B" fill-opacity="0.88"/>
      <text class="mono" font-size="12" fill="#8FA6B2" letter-spacing="2">BARRA VELHA · SC</text>
      <text class="sans" font-size="30" font-weight="800" fill="#EAF2F1" y="34" letter-spacing="-0.5">Praia da Barrinha</text>
    </g>

    <!-- pontos de referência (mesma numeração do pontos.json) -->
    <g id="pontos">
      <g transform="translate(860,305)"><circle r="19" fill="#FF8A3D" stroke="#0B1B2B" stroke-width="3"/><text class="num" text-anchor="middle" y="7">1</text>
        <rect x="-84" y="-70" width="168" height="34" rx="17" fill="#0B1B2B" fill-opacity="0.9"/><text class="rotulo" x="-68" y="-47">Ponta do Molhe</text></g>
      <g transform="translate(740,280)"><circle r="19" fill="#FF8A3D" stroke="#0B1B2B" stroke-width="3"/><text class="num" text-anchor="middle" y="7">2</text>
        <rect x="-160" y="-64" width="148" height="34" rx="17" fill="#0B1B2B" fill-opacity="0.9"/><text class="rotulo" x="-144" y="-41">Pico do Meio</text></g>
      <g transform="translate(715,455)"><circle r="19" fill="#FF8A3D" stroke="#0B1B2B" stroke-width="3"/><text class="num" text-anchor="middle" y="7">3</text>
        <rect x="-84" y="26" width="168" height="34" rx="17" fill="#0B1B2B" fill-opacity="0.9"/><text class="rotulo" x="-68" y="49">Canto do Molhe</text></g>
      <g transform="translate(580,415)"><circle r="19" fill="#FF8A3D" stroke="#0B1B2B" stroke-width="3"/><text class="num" text-anchor="middle" y="7">4</text>
        <rect x="-205" y="-17" width="180" height="34" rx="17" fill="#0B1B2B" fill-opacity="0.9"/><text class="rotulo" x="-189" y="6">Inside (beirinha)</text></g>
      <g transform="translate(440,170)"><circle r="19" fill="#FF8A3D" stroke="#0B1B2B" stroke-width="3"/><text class="num" text-anchor="middle" y="7">5</text>
        <rect x="26" y="-17" width="148" height="34" rx="17" fill="#0B1B2B" fill-opacity="0.9"/><text class="rotulo" x="42" y="6">Banco Norte</text></g>
      <g transform="translate(1045,430)"><circle r="19" fill="#FF8A3D" stroke="#0B1B2B" stroke-width="3"/><text class="num" text-anchor="middle" y="7">6</text>
        <rect x="26" y="-17" width="172" height="34" rx="17" fill="#0B1B2B" fill-opacity="0.9"/><text class="rotulo" x="42" y="6">Atrás do Molhe</text></g>
    </g>
  </g>
</svg>
