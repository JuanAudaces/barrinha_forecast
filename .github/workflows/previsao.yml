name: previsao

on:
  schedule:
    - cron: "7 * * * *"  # de hora em hora (UTC)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts || true  # sem ele a previsão sai igual, só sem áudio
      - run: python3 surf.py && mkdir _site && cp previsao.html _site/index.html && (cp -r audio _site/ || true)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
